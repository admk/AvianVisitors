server {
  listen 80;
  server_name _;
  absolute_redirect off;
  root /srv/app;
  index index.html index.php;

  location /stream {
    proxy_pass http://127.0.0.1:8000/stream;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 1h;
  }
  location = / { rewrite ^ /avian/frontend/index.html last; }
  location /index.php { return 302 /avian/frontend/index.html; }
  location ~ ^/avian/api/.*\.php$ {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_pass 127.0.0.1:9000;
  }
  location = /favicon.png { rewrite ^ /avian/assets/favicon.png last; }
  location = /styles.css { rewrite ^ /avian/frontend/styles.css last; }
  location = /apt.js { rewrite ^ /avian/frontend/apt.js last; }
  location = /dims.json { rewrite ^ /avian/frontend/dims.json last; }
  location = /masks.json { rewrite ^ /avian/frontend/masks.json last; }
  location /avian/ { try_files $uri =404; }
  location / { try_files $uri /avian/frontend/index.html; }
}
